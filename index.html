<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="dynamic.js" defer></script>
  <title>Library</title>
</head>

<body>
  <div class="container"></div>
  <button id="new-book-btn">Add new book</button>

  <dialog id="book-dialog">
    <form id="book-form">
      <h3>Add new book</h3>

      <label for="title">Title: </label>
      <input type="text" id="title" required>

      <label for="author">Author: </label>
      <input typr="text" id="author" required>

      <label for="pages">Pages: </label>
      <input type="number" id="pages" required min="1">
      
      <label for="read">Read or not read: </label>
      <input type="checkbox" id="read">

      <div class="form-buttons">
        <button type="submit" id="submit-btn">Submit</button>
        <button type="button" id="close-btn">Close</button>
      </div>
    </form>
  </dialog>
</body>

</html>
